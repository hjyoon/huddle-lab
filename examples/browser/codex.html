<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex AI Huddle</title>
<style>
:root {font:16px/1.65 system-ui,sans-serif;color-scheme:light dark}
body {max-width:720px;margin:56px auto;padding:0 24px} h1{font-size:1.8rem}
button {font:inherit;padding:10px 16px;margin:5px 5px 5px 0;cursor:pointer}
button:disabled{cursor:default} #error{color:light-dark(#ad2525,#ff9999)}
#workspace{overflow-wrap:anywhere} #transcripts{padding-left:24px}
</style>
</head>
<body>
<h1>Codex AI Huddle</h1>
<p>로컬 Codex와 음성으로 대화합니다. 통화를 시작하면 마이크를 사용하며, 음성은 Codex의 실시간 서비스로 전달됩니다.</p>
<p id="setup" role="status">Codex 설치 및 로그인 확인 중…</p>
<p>작업 폴더: <span id="workspace">확인 중</span> · 읽기 전용</p>
<p><strong id="status">대기 중</strong> · <span id="activity">대기</span></p>
<button id="start" disabled>Codex와 통화 시작</button>
<button id="mute" disabled aria-pressed="false">마이크 음소거</button>
<button id="interrupt" disabled>끼어들기</button>
<button id="stop" disabled>종료</button>
<p>수동 끼어들기는 응답을 멈추고 같은 대화의 음성 채널을 다시 연결합니다.</p>
<p id="error" role="alert"></p>
<h2>대화</h2>
<ol id="transcripts" aria-label="대화 발화문"></ol>
<script type="module" src="/examples/browser/codex-demo.js"></script>
</body>
</html>
