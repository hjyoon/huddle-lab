<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Huddle</title>
<style>
:root{font:16px/1.65 system-ui,sans-serif;color-scheme:light dark}body{max-width:720px;margin:56px auto;padding:0 24px}h1{font-size:1.8rem}button,select{font:inherit;padding:10px 16px;margin:5px 5px 5px 0}button{cursor:pointer}button:disabled{cursor:default}#error{color:light-dark(#ad2525,#ff9999)}#workspace{overflow-wrap:anywhere}.choice{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
</style></head><body>
<h1>AI Huddle</h1>
<div class="choice"><label for="provider">대화할 AI</label><select id="provider" aria-label="대화할 AI"><option value="codex">Codex</option><option value="claude">Claude</option></select></div>
<p id="description">AI 연결을 준비합니다.</p>
<p id="setup" role="status">설치 및 연결 상태 확인 중…</p>
<p>작업 폴더: <span id="workspace">확인 중</span></p>
<p><strong id="status">대기 중</strong> · <span id="activity">대기</span></p>
<button id="start" disabled>통화 시작</button><button id="mute" disabled aria-pressed="false">마이크 음소거</button><button id="interrupt" disabled>응답 중단</button><button id="stop" disabled>종료</button>
<p id="hint"></p><p>통화를 종료한 뒤 다른 AI를 선택할 수 있습니다.</p>
<p id="error" role="alert"></p><h2>대화</h2><ol id="transcripts" aria-label="대화 발화문"></ol>
<script type="module" src="/examples/browser/huddle-demo.js"></script></body></html>
