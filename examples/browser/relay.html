<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Huddle Lab · 로컬 Relay 통화</title>
    <style>
      :root { font: 16px/1.6 system-ui, sans-serif; color-scheme: light dark; }
      body { max-width: 640px; margin: 64px auto; padding: 0 24px; }
      h1 { font-size: 1.6rem; }
      button { font: inherit; padding: 8px 14px; margin: 4px 4px 4px 0; cursor: pointer; }
      button:disabled { cursor: default; }
      #error { color: light-dark(#a32020, #ff9696); }
    </style>
    <script type="importmap">{"imports":{"@noble/curves/":"/vendor/@noble/curves/","@noble/hashes/":"/vendor/@noble/hashes/"}}</script>
  </head>
  <body>
    <h1>Huddle Lab · 로컬 Relay 통화</h1>
    <p id="identity">임시 사용자 준비 중</p>
    <p>서버가 준비한 A와 B 링크를 각각 열고 통화를 시작하세요. 같은 컴퓨터에서 두 탭을 확인할 때는 이어폰을 사용하세요.</p>
    <p>음성은 이 컴퓨터의 테스트 Relay를 통해 전달되며 저장하지 않습니다. 사용자와 방은 서버를 다시 시작하면 초기화됩니다.</p>
    <p id="status" role="status">대기 중</p>
    <button id="start" type="button" disabled>통화 시작</button>
    <button id="mute" type="button" disabled aria-pressed="false">음소거</button>
    <button id="stop" type="button" disabled>종료</button>
    <p>참가자: <span id="participants">0</span>명 · 수신 프레임: <span id="received">0</span></p>
    <p id="error" role="alert"></p>
    <script type="module" src="/examples/browser/relay-demo.js"></script>
  </body>
</html>
